%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/nsing,n32h7xx-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NSING N32H7xx integrated USB high-speed PHY

maintainers:
  - Tobby Tan <tan.bo@nsingtech.com>

description: |
  Each DWC2 controller has an integrated UTMI PHY and a separate wrapper.
  The wrapper configures the PHY PLL and the physical or internal ID signal.
  USB packet RAM is powered by the PWR controller in a shared HSC domain.

properties:
  compatible:
    const: nsing,n32h7xx-usb-phy

  reg:
    maxItems: 1

  '#phy-cells':
    const: 0

  clocks:
    items:
      - description: PHY reference clock
      - description: Controller AHB bus clock

  clock-names:
    items:
      - const: ref
      - const: bus

  resets:
    maxItems: 1

  reset-names:
    const: por

  nsing,pwr:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PWR syscon controlling USB packet RAM and the HSC domain

  nsing,controller:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2]
    description: Controller number selecting the packet RAM and HSC domain

  nsing,external-id:
    type: boolean
    description: |
      Enable the physical ID input instead of the internal ID signal.
      Only use this when a usable ID signal is connected and pinmuxed.
      Software USB role switching does not require this property.

required:
  - compatible
  - reg
  - '#phy-cells'
  - clocks
  - clock-names
  - resets
  - reset-names
  - nsing,pwr
  - nsing,controller

additionalProperties: false

examples:
  - |
    phy@40140000 {
        compatible = "nsing,n32h7xx-usb-phy";
        reg = <0x40140000 0x8>;
        #phy-cells = <0>;
        clocks = <&rcc 4>, <&rcc 2>;
        clock-names = "ref", "bus";
        resets = <&rcc 3>;
        reset-names = "por";
        nsing,pwr = <&pwr>;
        nsing,controller = <1>;
    };
