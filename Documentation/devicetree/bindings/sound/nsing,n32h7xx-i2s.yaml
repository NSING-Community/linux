%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nsing,n32h7xx-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NSING N32H7xx I2S controller

maintainers:
  - Tobby Tan <tan.bo@nsingtech.com>

description: |
  I2S1 and its I2S1_EXT extension both work as clock consumers of an external
  codec and share CK and WS. The main block receives on its SD pin; the
  extension transmits on the SD_EXT pin, so capture and playback are two
  independent halves that may run at the same time. I2S4 generates the codec
  MCLK using its master receiver, whose clock continues without TX data.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: nsing,n32h7xx-i2s
  reg:
    items:
      - description: I2S1 main block registers
      - description: I2S1_EXT extension block registers
      - description: I2S4 MCLK generator registers
  reg-names:
    items:
      - const: rx
      - const: ext
      - const: mclk
  clocks:
    items:
      - description: I2S1 kernel clock
      - description: I2S4 kernel clock
  clock-names:
    items:
      - const: rx
      - const: mclk
  resets:
    minItems: 2
    maxItems: 2
  reset-names:
    items:
      - const: rx
      - const: mclk
  nsing,ws-monitor:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: |
      GPIO controller, pin and zero flags identifying the WS input monitor.
      The pin remains muxed to I2S. Its GPIO input register is read to align
      receiver enable to a word boundary without changing the pin function.
    maxItems: 1
  dmas:
    items:
      - description: I2S1 receive DMA
      - description: I2S1 transmit DMA, also used by the extension block
  dma-names:
    items:
      - const: rx
      - const: tx
  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - nsing,ws-monitor
  - dmas
  - dma-names
  - '#sound-dai-cells'

unevaluatedProperties: false
