%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/nsing,n32h7xx-btim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NSING N32H7xx basic timer clocksource

maintainers:
  - Tobby Tan <tan.bo@nsingtech.com>

description: |
  A 32-bit basic timer with a 16-bit prescaler, reserved for free-running
  system timekeeping. The clock is the timer kernel clock, not the APB
  register access clock. No interrupt is needed for clocksource operation.

properties:
  compatible:
    const: nsing,n32h7xx-btim

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - resets

additionalProperties: false
